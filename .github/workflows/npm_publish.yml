name: npm publish
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --network-concurrency 1

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build, Test, and Package
        run: pnpm run preversion

      # A prerelease must not land on the `latest` dist-tag, or every plain
      # `npm install @stellar/stellar-sdk` picks it up. Derive the tag from the
      # version so this needs no attention per release: 17.0.0-rc.1 -> `rc`,
      # 17.0.0 -> `latest`.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*)
              PRERELEASE="${VERSION#*-}"
              TAG="${PRERELEASE%%.*}"
              ;;
            *)
              TAG="latest"
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$TAG'."

      - name: Publish npm package
        run: npm publish --access public --provenance --tag "${{ steps.disttag.outputs.tag }}"
